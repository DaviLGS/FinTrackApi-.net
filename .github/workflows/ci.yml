name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FinTrack.sln

      - name: Build
        run: dotnet build FinTrack.sln --no-restore --configuration Release

      # Os testes de integração usam Testcontainers; o Docker já vem instalado no runner
      - name: Test
        run: dotnet test FinTrack.sln --no-build --configuration Release --verbosity normal

      - name: Build da imagem Docker
        run: docker build -f src/FinTrack.Api/Dockerfile .
